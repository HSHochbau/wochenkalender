<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WochenApp">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta name="theme-color" content="#004f92">
<meta name="supported-color-schemes" content="light dark">
<title>WochenApp</title>
<style>
:root{
  /* Die Seite meldet, dass sie beide Schemata selbst beherrscht.
     Dadurch rechnet der WebView von WhatsApp und Co. die Seite nicht
     selbst dunkel, sondern nimmt die Regeln im Dark-Block weiter unten,
     und die enthalten bewusst dieselben hellen Farben.
     Mit einem Opt-out greift dieser Dark-Block NICHT, dann dunkelt
     der WebView wieder selbst ab. */
  color-scheme:light dark;
  --blau:#004f92;
  --blau-hell:#3b82c4;
  --blau-dunkel:#003a6e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;forced-color-adjust:none}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;background:#bcbcc2;color:#1c1c1e;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  overscroll-behavior:none}
@media (prefers-color-scheme:dark){
  /* Der "Dunkelmodus" dieser App ist bewusst dieselbe helle Darstellung
     wie am iPhone. Jede farbgebende Regel steht hier noch einmal, damit
     nichts übrig bleibt, das ein Browser selbst abdunkeln könnte. */
  :root{--blau:#004f92;--blau-hell:#3b82c4;--blau-dunkel:#003a6e}
  html,body{background:#bcbcc2;color:#1c1c1e}

  #hdr{background:linear-gradient(to bottom,var(--blau-hell) 0%,var(--blau) 52%,var(--blau-dunkel) 100%);
       border-bottom-color:#002a52}
  #hdr-title{color:#fff}
  #yrbar{background:linear-gradient(to bottom,#6e6e73,#4d4d52);color:#fff}
  #yrnum{color:#fff}
  #ver{color:rgba(255,255,255,.45)}
  #heute-btn{background:linear-gradient(to bottom,rgba(255,255,255,.28),rgba(255,255,255,.1));
             border-color:rgba(0,0,0,.3);color:#fff}

  .wrow{background:linear-gradient(to bottom,#f4f4f7 0%,#e2e2e6 100%);border-bottom-color:#b6b6bc}
  .wrow.is-cur{background:linear-gradient(to bottom,#c9dcf0 0%,#a8c6e6 100%);border-bottom-color:#7aa3cd}
  .wrow.sel-a{background:linear-gradient(to bottom,#bcd4ee 0%,#98bce2 100%);outline-color:var(--blau)}
  .wrow.sel-b{background:linear-gradient(to bottom,#d5e4f4 0%,#bcd2ea 100%);outline-color:var(--blau)}
  .wrow.pressing{background:linear-gradient(to bottom,#d5e4f4,#bcd2ea)}

  .kwbox{background:linear-gradient(to bottom,#ffffff 0%,#e9e9ee 100%);border-color:var(--blau)}
  .kwnum{color:#1c1c1e}
  .is-cur .kwbox{background:linear-gradient(to bottom,var(--blau-hell),var(--blau) 60%,var(--blau-dunkel))}
  .is-cur .kwnum{color:#fff}

  .mrow{background:linear-gradient(to bottom,#fdfdfe,#ececf0)}
  .mlbl{color:#8a8a8e}

  .dc{background:linear-gradient(to bottom,#ffffff 0%,#e6e6ea 100%)}
  .dn{color:#3a3a3e}
  .dc.off{background:linear-gradient(to bottom,rgba(255,255,255,.55),rgba(230,230,234,.45))}
  .dc.off .dn{color:#a9a9af}
  .dc.td{background:linear-gradient(to bottom,var(--blau-hell),var(--blau) 60%,var(--blau-dunkel));
         border-color:var(--blau-dunkel)}
  .dc.td .dn{color:#fff}
  .hdot{background:var(--blau)}
  .dc.td .hdot{background:rgba(255,255,255,.9)}
  .ast{color:var(--blau)}
  .dc.td .ast{color:#fff}
  .chev{color:#9a9aa0}

  #popup{background:linear-gradient(to bottom,var(--blau-hell),var(--blau) 30%,var(--blau-dunkel));color:#fff}
  .pstat{background:linear-gradient(to bottom,rgba(255,255,255,.2),rgba(255,255,255,.08))}
  #toast{background:rgba(20,20,24,.92);color:#fff}
}

body{padding-top:calc(80px + env(safe-area-inset-top))}
body{-webkit-touch-callout:none}

/* ───────── Header: glossy Blau ───────── */
#hdr{
  position:fixed;top:0;left:0;right:0;z-index:100;height:calc(48px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex;align-items:stretch;
  background:linear-gradient(to bottom,var(--blau-hell) 0%,var(--blau) 52%,var(--blau-dunkel) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px rgba(0,0,0,.35);
  border-bottom:1px solid #002a52;
}
#logo-wrap{width:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#logo{
  width:34px;height:34px;border-radius:6px;display:block;
  box-shadow:0 1px 2px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.2);
}
#hdr-title{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding-right:52px; /* gleicht die Logo-Breite aus → Text exakt mittig */
  color:#fff;font-size:19px;font-weight:800;letter-spacing:3px;
  text-shadow:0 -1px 1px rgba(0,0,0,.45);font-stretch:condensed;
  overflow:hidden;white-space:nowrap;
}

/* ───────── Jahrbalken: fix ganz oben, zeigt Jahr der obersten Woche ───────── */
#yrbar{
  position:fixed;top:calc(48px + env(safe-area-inset-top));left:0;right:0;z-index:90;
  height:31px;
  background:linear-gradient(to bottom,#6e6e73,#4d4d52);
  color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px 0 14px;
  text-shadow:0 -1px 0 rgba(0,0,0,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 3px rgba(0,0,0,.3);
  user-select:none;-webkit-user-select:none;
}
#yrnum{font-size:17px;font-weight:700;line-height:1}
#yrleft{display:flex;align-items:baseline;gap:7px}
#ver{font-size:10px;font-weight:600;color:rgba(255,255,255,.45);letter-spacing:.5px}
#heute-btn{
  border:none;cursor:pointer;font-family:inherit;
  background:linear-gradient(to bottom,rgba(255,255,255,.28),rgba(255,255,255,.1));
  border:.5px solid rgba(0,0,0,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 1px rgba(0,0,0,.25);
  color:#fff;font-size:11px;font-weight:700;letter-spacing:1.5px;
  padding:4px 12px;border-radius:12px;
  text-shadow:0 -1px 1px rgba(0,0,0,.4);
}
#heute-btn:active{background:rgba(0,0,0,.3)}
#yrbar.pressing{background:linear-gradient(to bottom,#8a8a90,#5d5d63)}

/* ───────── Wochenzeile ───────── */
.wrow{
  display:flex;align-items:center;gap:9px;
  padding:8px 8px 9px 8px;
  background:linear-gradient(to bottom,#f4f4f7 0%,#e2e2e6 100%);
  border-bottom:1px solid #b6b6bc;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
  user-select:none;-webkit-user-select:none;position:relative;
}
.wrow.is-cur{
  background:linear-gradient(to bottom,#c9dcf0 0%,#a8c6e6 100%);
  border-bottom-color:#7aa3cd;
}
.wrow.sel-a{outline:3px solid var(--blau);outline-offset:-3px;z-index:2;
  background:linear-gradient(to bottom,#bcd4ee 0%,#98bce2 100%)}
.wrow.sel-b{outline:3px dashed var(--blau);outline-offset:-3px;z-index:2;
  background:linear-gradient(to bottom,#d5e4f4 0%,#bcd2ea 100%)}
.wrow.pressing{background:linear-gradient(to bottom,#d5e4f4,#bcd2ea)}

/* ───────── KW-Box ───────── */
.kwbox{
  width:60px;min-width:60px;height:60px;flex-shrink:0;
  border:2.5px solid var(--blau);border-radius:13px;
  background:linear-gradient(to bottom,#ffffff 0%,#e9e9ee 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.25),inset 0 1px 0 #fff;
  display:flex;align-items:center;justify-content:center;
}
.kwnum{font-size:31px;font-weight:700;color:#1c1c1e;line-height:1;
  text-shadow:0 1px 0 rgba(255,255,255,.8)}
.is-cur .kwbox{
  background:linear-gradient(to bottom,var(--blau-hell),var(--blau) 60%,var(--blau-dunkel));
  box-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);
}
.is-cur .kwnum{color:#fff;text-shadow:0 -1px 1px rgba(0,0,0,.4)}

/* ───────── Inhalt ───────── */
.wcnt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}

/* Monatspille */
.mrow{
  background:linear-gradient(to bottom,#fdfdfe,#ececf0);
  border-radius:8px;padding:4px 12px;
  box-shadow:0 1px 1px rgba(0,0,0,.14),inset 0 1px 0 #fff;
  border:.5px solid rgba(0,0,0,.06);
}
.mlbl{font-size:15px;color:#8a8a8e;font-weight:400;line-height:1.25;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;display:block;
  text-shadow:0 1px 0 rgba(255,255,255,.9)}

/* Tage */
.drow{display:flex;gap:4px}
.dc{
  flex:1;min-width:0;height:38px;border-radius:8px;
  background:linear-gradient(to bottom,#ffffff 0%,#e6e6ea 100%);
  box-shadow:0 1px 1px rgba(0,0,0,.16),inset 0 1px 0 #fff;
  border:.5px solid rgba(0,0,0,.06);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  position:relative;
}
.dn{font-size:16px;font-weight:500;color:#3a3a3e;line-height:1;
  text-shadow:0 1px 0 rgba(255,255,255,.8)}

/* Nicht-Arbeitstage (Sa, So, Feiertage, freie Freitage): einheitlich grau */
.dc.off{background:linear-gradient(to bottom,rgba(255,255,255,.55),rgba(230,230,234,.45));
  box-shadow:0 1px 1px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.5)}
.dc.off .dn{color:#a9a9af}

/* Heute */
.dc.td{
  background:linear-gradient(to bottom,var(--blau-hell),var(--blau) 60%,var(--blau-dunkel));
  box-shadow:0 1px 2px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35);
  border-color:var(--blau-dunkel);
}
.dc.td .dn{color:#fff;text-shadow:0 -1px 1px rgba(0,0,0,.4)}

/* Feiertagspunkt */
.hdot{width:5px;height:5px;border-radius:50%;background:var(--blau);flex-shrink:0}
.dc.td .hdot{background:rgba(255,255,255,.9)}

/* Eingearbeiteter Freitag: normaler Arbeitstag + Stern */
.ast{position:absolute;top:1px;right:4px;color:var(--blau);font-size:13px;font-weight:700;line-height:1}
.dc.td .ast{color:#fff}

.chev{color:#9a9aa0;font-size:24px;flex-shrink:0;line-height:1;
  text-shadow:0 1px 0 rgba(255,255,255,.8);font-weight:300}

/* ───────── Popup Zeitraum ───────── */
#popup{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:linear-gradient(to bottom,var(--blau-hell),var(--blau) 30%,var(--blau-dunkel));
  color:#fff;border-radius:18px 18px 0 0;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 28px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3);
  transform:translateY(110%);transition:transform .3s cubic-bezier(.34,1.4,.64,1);
}
#popup.show{transform:translateY(0)}
.ptitle{font-size:11px;opacity:.75;letter-spacing:1.2px;text-transform:uppercase;
  margin-bottom:14px;text-align:center;text-shadow:0 -1px 1px rgba(0,0,0,.35)}
.pstats{display:flex;gap:10px}
.pstat{flex:1;text-align:center;border-radius:12px;padding:14px 10px;
  background:linear-gradient(to bottom,rgba(255,255,255,.2),rgba(255,255,255,.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.pstat-n{font-size:38px;font-weight:700;line-height:1;text-shadow:0 -1px 1px rgba(0,0,0,.35)}
.pstat-l{font-size:11px;opacity:.72;margin-top:5px}
.phint{text-align:center;font-size:12px;opacity:.55;margin-top:12px}
.pclose{text-align:center;font-size:13px;opacity:.7;margin-top:8px;cursor:pointer;padding:10px}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);z-index:300;
  background:rgba(20,20,24,.92);color:#fff;font-size:13px;
  padding:9px 16px;border-radius:20px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  box-shadow:0 4px 14px rgba(0,0,0,.4);
  max-width:92vw;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

const MS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
    f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,
    m=Math.floor((a+11*h+22*l)/451),
    mo=Math.floor((h+l-7*m+114)/31),
    da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
function dk(d){return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0')}
function addD(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}

/* ── Gesetzliche Feiertage Österreich ── */
const hC={};
function getH(y){
  if(hC[y])return hC[y];
  const h={},s=(d,n)=>{h[dk(d)]={name:n}};
  s(new Date(y,0,1),'Neujahr');
  s(new Date(y,0,6),'Heilige Drei Könige');
  s(new Date(y,4,1),'Staatsfeiertag');
  s(new Date(y,7,15),'Maria Himmelfahrt');
  s(new Date(y,9,26),'Nationalfeiertag');
  s(new Date(y,10,1),'Allerheiligen');
  s(new Date(y,11,8),'Maria Empfängnis');
  s(new Date(y,11,25),'Christtag');
  s(new Date(y,11,26),'Stephanitag');
  const e=easter(y);
  s(addD(e,1),'Ostermontag');
  s(addD(e,39),'Christi Himmelfahrt');
  s(addD(e,50),'Pfingstmontag');
  s(addD(e,60),'Fronleichnam');
  return hC[y]=h;
}
function isH(d){return getH(d.getFullYear())[dk(d)]||null}

      '2026-09-11',   // KW 37
      '2026-09-18',   // KW 38
      '2026-10-02',   // KW 40
      '2026-10-23',   // KW 43
      '2026-11-13',   // KW 46
      '2026-12-04'    // KW 49
    ],
    worked:[
      // eingearbeitete Freitage, z. B. '2026-12-11'
    ]
  },

  2027:{
    free:[
      // Termine für 2027 hier eintragen, z. B. '2027-06-25',
    ],
    worked:[
    ]
  }

};

/* ── ab hier nichts mehr ändern ── */
const ffC={};
function getFF(y){
  if(ffC[y])return ffC[y];
  const b=FREIE_FREITAGE[y];
  return ffC[y]={free:new Set(b?b.free:[]),worked:new Set(b?b.worked:[])};
}
function isFreeDay(d){return getFF(d.getFullYear()).free.has(dk(d))}
function isWorkedFri(d){return getFF(d.getFullYear()).worked.has(dk(d))}

function isWD(d){
  const w=d.getDay();if(w===0||w===6)return false;
  if(isH(d))return false;
  if(isFreeDay(d))return false;
  return true;
}

function isoW(d){
  const u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const wd=u.getUTCDay()||7;u.setUTCDate(u.getUTCDate()+4-wd);
  const y1=new Date(Date.UTC(u.getUTCFullYear(),0,1));
  return Math.ceil(((u-y1)/864e5+1)/7);
}
function isoWY(d){
  const u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const wd=u.getUTCDay()||7;u.setUTCDate(u.getUTCDate()+4-wd);
  return u.getUTCFullYear();
}
function weekMon(iy,iw){
  const j4=new Date(iy,0,4),j4d=j4.getDay()||7,m=new Date(j4);
  m.setDate(j4.getDate()-(j4d-1)+(iw-1)*7);return m;
}

const today=new Date();today.setHours(0,0,0,0);
const todayK=dk(today),curKW=isoW(today),curKWY=isoWY(today);
let selA=null,selB=null;

function buildWeeks(){
  const start=addD(weekMon(curKWY,curKW),-54*7);
  return Array.from({length:120},(_,i)=>{
    const mon=addD(start,i*7);
    return{iw:isoW(mon),iwy:isoWY(mon),days:Array.from({length:7},(_,d)=>addD(mon,d))};
  });
}
function mlabel(days){
  const a=days[0],b=days[6];
  return a.getMonth()===b.getMonth()?MONTHS[a.getMonth()]:MS[a.getMonth()]+' – '+MS[b.getMonth()];
}

let toastTmr=null;
function showToast(txt){
  const t=document.getElementById('toast');
  t.textContent=txt;t.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr=setTimeout(()=>t.classList.remove('show'),2200);
}

/* Long-Press-Helfer */
/* Long-Press mit Bewegungstoleranz.
   Android meldet schon bei minimalem Fingerzittern ein touchmove – mit der
   alten Logik ("jede Bewegung bricht ab") kam der lange Druck dort praktisch
   nie zustande, deshalb liess sich keine Woche markieren und es wurde nichts
   gerechnet. iOS unterdrückt solche Mikro-Bewegungen, darum fiel es dort nicht auf. */
const LP_TOL=14;     // Pixel, die der Finger wandern darf
const LP_TIME=550;   // Haltedauer in Millisekunden
let lpFired=0;       // Zeitstempel, um den Klick nach dem Long-Press zu schlucken

function addLP(el,fn){
  let tmr=null,sx=0,sy=0;
  function start(x,y){
    sx=x;sy=y;
    el.classList.add('pressing');
    clearTimeout(tmr);
    tmr=setTimeout(()=>{
      el.classList.remove('pressing');
      lpFired=Date.now();
      try{navigator.vibrate&&navigator.vibrate(40);}catch(e){}
      fn();
    },LP_TIME);
  }
  function move(x,y){
    if(Math.abs(x-sx)>LP_TOL||Math.abs(y-sy)>LP_TOL)cancel();
  }
  function cancel(){clearTimeout(tmr);tmr=null;el.classList.remove('pressing');}

  el.addEventListener('touchstart',e=>{const t=e.touches[0];start(t.clientX,t.clientY);},{passive:true});
  el.addEventListener('touchmove',e=>{const t=e.touches[0];move(t.clientX,t.clientY);},{passive:true});
  el.addEventListener('touchend',cancel);
  el.addEventListener('touchcancel',cancel);
  el.addEventListener('contextmenu',e=>e.preventDefault());  // Android-Auswahlmenü unterdrücken
  el.addEventListener('mousedown',e=>start(e.clientX,e.clientY));
  el.addEventListener('mousemove',e=>move(e.clientX,e.clientY));
  el.addEventListener('mouseup',cancel);
  el.addEventListener('mouseleave',cancel);
  el.addEventListener('scroll',cancel,{passive:true});
}
window.addEventListener('scroll',()=>{document.querySelectorAll('.pressing').forEach(e=>e.classList.remove('pressing'));},{passive:true});

/* ── Jahrbalken ── */
const rowsIdx=[];
let yrShown=null;
function topH(){
  return document.getElementById('hdr').offsetHeight+document.getElementById('yrbar').offsetHeight;
}
function updateYrBar(){
  if(!rowsIdx.length)return;
  const t=document.getElementById('yrbar').getBoundingClientRect().bottom;
  let lo=0,hi=rowsIdx.length-1,ans=rowsIdx.length-1;
  while(lo<=hi){
    const m=(lo+hi)>>1,r=rowsIdx[m].el;
    if(r.offsetTop+r.offsetHeight-window.scrollY>t){ans=m;hi=m-1;}else lo=m+1;
  }
  const y=rowsIdx[ans].iwy;
  if(y!==yrShown){yrShown=y;document.getElementById('yrnum').textContent=y;}
}
let scrTick=false;
window.addEventListener('scroll',()=>{
  if(!scrTick){scrTick=true;requestAnimationFrame(()=>{scrTick=false;updateYrBar();});}
},{passive:true});

function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  const weeks=buildWeeks();
  let curRow=null;
  rowsIdx.length=0;
  const frag=document.createDocumentFragment();

  weeks.forEach(({iw,iwy,days})=>{
    const isCur=iw===curKW&&iwy===curKWY;
    const row=document.createElement('div');
    row.className='wrow'+(isCur?' is-cur':'');
    if(isCur)curRow=row;

    const kb=document.createElement('div');kb.className='kwbox';
    kb.innerHTML='<span class="kwnum">'+iw+'</span>';

    const cnt=document.createElement('div');cnt.className='wcnt';

    const mr=document.createElement('div');mr.className='mrow';
    const ml=document.createElement('span');ml.className='mlbl';ml.textContent=mlabel(days);
    mr.appendChild(ml);

    const dr=document.createElement('div');dr.className='drow';
    days.forEach((d,i)=>{
      const dc=document.createElement('div');dc.className='dc';
      const isWE=i>=5,isTd=dk(d)===todayK,hol=isH(d),free=isFreeDay(d),worked=isWorkedFri(d);
      if(isWE||hol||free)dc.classList.add('off');
      if(isTd)dc.classList.add('td');
      const dn=document.createElement('div');dn.className='dn';dn.textContent=d.getDate();
      dc.appendChild(dn);
      if(hol){
        const dot=document.createElement('div');dot.className='hdot';dc.appendChild(dot);
        dc.addEventListener('click',ev=>{ev.stopPropagation();if(Date.now()-lpFired<700)return;showToast(d.getDate()+'. '+MONTHS[d.getMonth()]+': '+hol.name);});
      }else if(free){
        dc.addEventListener('click',ev=>{ev.stopPropagation();if(Date.now()-lpFired<700)return;showToast(d.getDate()+'. '+MONTHS[d.getMonth()]+': Freier Freitag');});
      }else if(worked){
        const a=document.createElement('span');a.className='ast';a.textContent='*';dc.appendChild(a);
        dc.addEventListener('click',ev=>{ev.stopPropagation();if(Date.now()-lpFired<700)return;showToast(d.getDate()+'. '+MONTHS[d.getMonth()]+': Eingearbeiteter Freitag');});
      }
      dr.appendChild(dc);
    });

    cnt.appendChild(mr);cnt.appendChild(dr);
    const chv=document.createElement('div');chv.className='chev';chv.textContent='›';
    row.appendChild(kb);row.appendChild(cnt);row.appendChild(chv);

    addLP(row,()=>lp(row,iw,iwy));
    rowsIdx.push({el:row,iwy});
    frag.appendChild(row);
  });
  app.appendChild(frag);

  setTimeout(()=>{
    if(curRow){
      const rh=curRow.offsetHeight+1;
      window.scrollTo({top:Math.max(0,curRow.offsetTop-rh*2-topH()),behavior:'instant'});
    }
    updateYrBar();
  },40);
}

/* ── Wochen-Markierung / Zeitraumrechnung ── */
function lp(row,iw,iwy){
  if(!selA){selA={iw,iwy,el:row};row.classList.add('sel-a');}
  else if(selA.iw===iw&&selA.iwy===iwy){clearSel();}
  else{
    if(selB)selB.el.classList.remove('sel-b');
    selB={iw,iwy,el:row};row.classList.add('sel-b');calc();
  }
}

function calc(){
  if(!selA||!selB)return;
  let a=weekMon(selA.iwy,selA.iw),b=weekMon(selB.iwy,selB.iw);
  if(a>b)[a,b]=[b,a];
  // Beide markierte Wochen werden mitgezählt:
  // KW-Anzahl = inklusive Start- und Endwoche;
  // Arbeitstage = Montag der ersten bis Freitag der letzten Woche.
  const wks=Math.round((b-a)/(7*864e5))+1;
  let wd=0,c=new Date(a),end=addD(b,4);
  while(c<=end){if(isWD(c))wd++;c=addD(c,1);}
  document.getElementById('p-kw').textContent=wks;
  document.getElementById('p-wd').textContent=wd;
  const lo=(a.getTime()===weekMon(selA.iwy,selA.iw).getTime())?selA:selB;
  const hi=(lo===selA)?selB:selA;
  document.getElementById('p-range').textContent=
    'KW '+lo.iw+'/'+lo.iwy+' bis KW '+hi.iw+'/'+hi.iwy+' · beide Wochen mitgezählt';
  document.getElementById('popup').classList.add('show');
}

function clearSel(){
  if(selA){selA.el.classList.remove('sel-a');selA=null;}
  if(selB){selB.el.classList.remove('sel-b');selB=null;}
  document.getElementById('popup').classList.remove('show');
}

document.getElementById('heute-btn').addEventListener('click',()=>{
  const r=document.querySelector('.is-cur');
  if(r)window.scrollTo({top:Math.max(0,r.offsetTop-(r.offsetHeight+1)*2-topH()),behavior:'smooth'});
});

render();
</script>
